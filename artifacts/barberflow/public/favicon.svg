<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <pattern id="pole" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="60" height="60" fill="#ffffff"/>
      <rect width="15" height="60" fill="#e63946"/>
      <rect x="30" width="15" height="60" fill="#1d4ed8"/>
    </pattern>
    <clipPath id="r"><rect width="180" height="180" rx="40"/></clipPath>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#pole)" clip-path="url(#r)"/>
</svg>
