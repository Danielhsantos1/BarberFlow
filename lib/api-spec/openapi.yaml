openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API do BarberFlow para operação de barbearias por tenant
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: salon
  - name: dashboard
  - name: appointments
  - name: clients
  - name: barbers
  - name: services
  - name: finance
  - name: inventory
  - name: marketing
  - name: booking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /salon/current:
    get:
      operationId: getCurrentSalon
      tags: [salon]
      summary: Get the signed-in user's salon
      responses:
        "200":
          description: Salon and current membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonContext"
        "401":
          description: Authentication required
        "404":
          description: Salon onboarding is required
    patch:
      operationId: updateCurrentSalon
      tags: [salon]
      summary: Update current salon settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalonUpdate"
      responses:
        "200":
          description: Updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
  /salon:
    post:
      operationId: createSalon
      tags: [salon]
      summary: Create the first salon for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalonInput"
      responses:
        "201":
          description: Salon created with owner membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonContext"
        "401":
          description: Authentication required
        "409":
          description: User already belongs to a salon
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get operational dashboard metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments in a date range
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string, format: date }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date }
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [scheduled, confirmed, completed, cancelled, no_show]
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create an appointment from the admin panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "409":
          description: Barber is already booked in that time slot
  /appointments/{appointmentId}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment details or status
      parameters:
        - in: path
          name: appointmentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Appointment not found
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Cancel an appointment
      parameters:
        - in: path
          name: appointmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Appointment cancelled
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: Search and list clients
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{clientId}:
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - in: path
          name: clientId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - in: path
          name: clientId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Client deleted
  /barbers:
    get:
      operationId: listBarbers
      tags: [barbers]
      summary: List barbers
      responses:
        "200":
          description: Barbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Barber"
    post:
      operationId: createBarber
      tags: [barbers]
      summary: Add a barber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberInput"
      responses:
        "201":
          description: Barber created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Barber"
  /barbers/{barberId}:
    patch:
      operationId: updateBarber
      tags: [barbers]
      summary: Update a barber
      parameters:
        - in: path
          name: barberId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberUpdate"
      responses:
        "200":
          description: Updated barber
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Barber"
    delete:
      operationId: deleteBarber
      tags: [barbers]
      summary: Deactivate a barber
      parameters:
        - in: path
          name: barberId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Barber deactivated
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /services/{serviceId}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Deactivate a service
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Service deactivated
  /finance:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Get monthly financial summary and transactions
      parameters:
        - in: query
          name: month
          required: false
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
  /finance/transactions:
    post:
      operationId: createTransaction
      tags: [finance]
      summary: Add a cash entry or expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List stock items
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Add a stock item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryInput"
      responses:
        "201":
          description: Stock item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
  /inventory/{itemId}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update a stock item
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUpdate"
      responses:
        "200":
          description: Updated stock item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete a stock item
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Stock item deleted
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [marketing]
      summary: List coupons and marketing campaigns
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [marketing]
      summary: Create a coupon campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
  /public/salons/{slug}:
    get:
      operationId: getPublicSalon
      tags: [booking]
      summary: Get public salon details and services for online booking
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public salon information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSalon"
        "404":
          description: Salon not found
  /public/salons/{slug}/availability:
    post:
      operationId: checkBookingAvailability
      tags: [booking]
      summary: Get available appointment slots
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityInput"
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"
  /public/salons/{slug}/bookings:
    post:
      operationId: createPublicBooking
      tags: [booking]
      summary: Book a service without an admin account
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicBookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "409":
          description: Time slot is no longer available
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Salon:
      type: object
      required: [id, name, slug, phone, whatsapp, address, plan, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        cnpj: { type: ["string", "null"] }
        address: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        logoUrl: { type: ["string", "null"] }
        openingHours:
          type: object
          additionalProperties: true
        plan: { type: string, enum: [free, pro, business] }
        createdAt: { type: string, format: date-time }
    SalonContext:
      type: object
      required: [salon, role]
      properties:
        salon: { $ref: "#/components/schemas/Salon" }
        role: { type: string, enum: [owner, admin, barber, receptionist] }
    SalonInput:
      type: object
      required: [name, address, phone, whatsapp]
      properties:
        name: { type: string, minLength: 2 }
        cnpj: { type: string }
        address: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        openingHours:
          type: object
          additionalProperties: true
    SalonUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        cnpj: { type: ["string", "null"] }
        address: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        logoUrl: { type: ["string", "null"] }
        openingHours:
          type: object
          additionalProperties: true
    DashboardSummary:
      type: object
      required: [todayAppointments, monthlyRevenue, clientCount, serviceCount, upcomingAppointments, topServices, weeklyRevenue]
      properties:
        todayAppointments: { type: integer }
        monthlyRevenue: { type: number }
        clientCount: { type: integer }
        serviceCount: { type: integer }
        upcomingAppointments:
          type: array
          items: { $ref: "#/components/schemas/Appointment" }
        topServices:
          type: array
          items: { $ref: "#/components/schemas/ServiceMetric" }
        weeklyRevenue:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }
    ServiceMetric:
      type: object
      required: [name, bookings, revenue]
      properties:
        name: { type: string }
        bookings: { type: integer }
        revenue: { type: number }
    RevenuePoint:
      type: object
      required: [label, revenue]
      properties:
        label: { type: string }
        revenue: { type: number }
    Appointment:
      type: object
      required: [id, date, startTime, endTime, status, price, clientName, barberId, barberName, serviceId, serviceName]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        startTime: { type: string }
        endTime: { type: string }
        status: { type: string, enum: [scheduled, confirmed, completed, cancelled, no_show] }
        price: { type: number }
        clientId: { type: ["string", "null"], format: uuid }
        clientName: { type: string }
        clientPhone: { type: ["string", "null"] }
        barberId: { type: string, format: uuid }
        barberName: { type: string }
        serviceId: { type: string, format: uuid }
        serviceName: { type: string }
        notes: { type: ["string", "null"] }
    AppointmentInput:
      type: object
      required: [date, startTime, clientName, clientPhone, barberId, serviceId]
      properties:
        date: { type: string, format: date }
        startTime: { type: string }
        clientName: { type: string, minLength: 2 }
        clientPhone: { type: string }
        clientId: { type: ["string", "null"], format: uuid }
        barberId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        notes: { type: ["string", "null"] }
    AppointmentUpdate:
      type: object
      properties:
        date: { type: string, format: date }
        startTime: { type: string }
        status: { type: string, enum: [scheduled, confirmed, completed, cancelled, no_show] }
        barberId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        notes: { type: ["string", "null"] }
    Client:
      type: object
      required: [id, name, phone, email, visits, loyaltyPoints, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        visits: { type: integer }
        loyaltyPoints: { type: integer }
        preferredStyle: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        lastVisit: { type: ["string", "null"], format: date }
        createdAt: { type: string, format: date-time }
    ClientInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string }
        email: { type: ["string", "null"], format: email }
        preferredStyle: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    ClientUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string }
        email: { type: ["string", "null"], format: email }
        preferredStyle: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    Barber:
      type: object
      required: [id, name, phone, specialties, commissionPct, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: ["string", "null"] }
        specialties:
          type: array
          items: { type: string }
        commissionPct: { type: number }
        active: { type: boolean }
        workingHours:
          type: object
          additionalProperties: true
    BarberInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: ["string", "null"] }
        specialties:
          type: array
          items: { type: string }
        commissionPct: { type: number, minimum: 0, maximum: 100 }
        workingHours:
          type: object
          additionalProperties: true
    BarberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: ["string", "null"] }
        specialties:
          type: array
          items: { type: string }
        commissionPct: { type: number, minimum: 0, maximum: 100 }
        active: { type: boolean }
        workingHours:
          type: object
          additionalProperties: true
    Service:
      type: object
      required: [id, name, category, durationMinutes, price, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        durationMinutes: { type: integer }
        price: { type: number }
        active: { type: boolean }
        description: { type: ["string", "null"] }
    ServiceInput:
      type: object
      required: [name, category, durationMinutes, price]
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string }
        durationMinutes: { type: integer, minimum: 5 }
        price: { type: number, minimum: 0 }
        description: { type: ["string", "null"] }
    ServiceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string }
        durationMinutes: { type: integer, minimum: 5 }
        price: { type: number, minimum: 0 }
        active: { type: boolean }
        description: { type: ["string", "null"] }
    Transaction:
      type: object
      required: [id, description, kind, category, amount, date]
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        kind: { type: string, enum: [income, expense] }
        category: { type: string }
        amount: { type: number }
        date: { type: string, format: date }
    TransactionInput:
      type: object
      required: [description, kind, category, amount, date]
      properties:
        description: { type: string, minLength: 2 }
        kind: { type: string, enum: [income, expense] }
        category: { type: string }
        amount: { type: number, minimum: 0 }
        date: { type: string, format: date }
    FinanceSummary:
      type: object
      required: [month, income, expenses, net, transactions, monthlyTrend]
      properties:
        month: { type: string }
        income: { type: number }
        expenses: { type: number }
        net: { type: number }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        monthlyTrend:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }
    InventoryItem:
      type: object
      required: [id, name, quantity, minimumQuantity, unit, supplier]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: number }
        minimumQuantity: { type: number }
        unit: { type: string }
        supplier: { type: ["string", "null"] }
        unitCost: { type: number }
        lowStock: { type: boolean }
    InventoryInput:
      type: object
      required: [name, quantity, minimumQuantity, unit]
      properties:
        name: { type: string, minLength: 2 }
        quantity: { type: number, minimum: 0 }
        minimumQuantity: { type: number, minimum: 0 }
        unit: { type: string }
        supplier: { type: ["string", "null"] }
        unitCost: { type: number, minimum: 0 }
    InventoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        quantity: { type: number, minimum: 0 }
        minimumQuantity: { type: number, minimum: 0 }
        unit: { type: string }
        supplier: { type: ["string", "null"] }
        unitCost: { type: number, minimum: 0 }
    Campaign:
      type: object
      required: [id, name, code, discountPct, active, redemptionCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        discountPct: { type: number }
        active: { type: boolean }
        redemptionCount: { type: integer }
        startsAt: { type: ["string", "null"], format: date }
        endsAt: { type: ["string", "null"], format: date }
    CampaignInput:
      type: object
      required: [name, code, discountPct]
      properties:
        name: { type: string, minLength: 2 }
        code: { type: string, minLength: 3 }
        discountPct: { type: number, minimum: 1, maximum: 100 }
        startsAt: { type: ["string", "null"], format: date }
        endsAt: { type: ["string", "null"], format: date }
    PublicSalon:
      type: object
      required: [name, slug, address, phone, whatsapp, services, barbers]
      properties:
        name: { type: string }
        slug: { type: string }
        address: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        logoUrl: { type: ["string", "null"] }
        services:
          type: array
          items: { $ref: "#/components/schemas/Service" }
        barbers:
          type: array
          items: { $ref: "#/components/schemas/Barber" }
    AvailabilitySlot:
